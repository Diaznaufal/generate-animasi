<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
      <rect width="1080" height="1920" fill="#450a0a" />
      <linearGradient id="heatSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#991b1b" />
        <stop offset="45%" stop-color="#ea580c" />
        <stop offset="85%" stop-color="#facc15" />
        <stop offset="100%" stop-color="#451a03" />
      </linearGradient>
      <rect width="1080" height="1920" fill="url(#heatSky)" />
      
      <!-- Giant Blazing Sun -->
      <circle cx="540" cy="620" r="280" fill="#fef08a" filter="url(#glow)" />
      <circle cx="540" cy="620" r="220" fill="#ffffff" />
      
      <!-- Heat Wave Rays -->
      <line x1="540" y1="620" x2="540" y2="240" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(0 540 620)" />
<line x1="540" y1="620" x2="540" y2="240" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(22.5 540 620)" />
<line x1="540" y1="620" x2="540" y2="240" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(45 540 620)" />
<line x1="540" y1="620" x2="540" y2="240" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(67.5 540 620)" />
<line x1="540" y1="620" x2="540" y2="240" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(90 540 620)" />
<line x1="540" y1="620" x2="540" y2="240" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(112.5 540 620)" />
<line x1="540" y1="620" x2="540" y2="240" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(135 540 620)" />
<line x1="540" y1="620" x2="540" y2="240" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(157.5 540 620)" />
<line x1="540" y1="620" x2="540" y2="240" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(180 540 620)" />
<line x1="540" y1="620" x2="540" y2="240" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(202.5 540 620)" />
<line x1="540" y1="620" x2="540" y2="240" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(225 540 620)" />
<line x1="540" y1="620" x2="540" y2="240" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(247.5 540 620)" />
<line x1="540" y1="620" x2="540" y2="240" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(270 540 620)" />
<line x1="540" y1="620" x2="540" y2="240" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(292.5 540 620)" />
<line x1="540" y1="620" x2="540" y2="240" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(315 540 620)" />
<line x1="540" y1="620" x2="540" y2="240" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.6" transform="rotate(337.5 540 620)" />
      
      <!-- Temperature Display Gauge -->
      <g transform="translate(740, 480)">
        <rect x="0" y="0" width="240" height="150" rx="24" fill="rgba(0,0,0,0.75)" stroke="#ef4444" stroke-width="4" />
        <text x="120" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="34" fill="#fbbf24">SUHU REL</text>
        <text x="120" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="52" fill="#ef4444">&gt; 55°C</text>
      </g>
      
      <!-- Distant Wavy Heat Waves on Tracks -->
      <path d="M100,1400 Q300,1360 540,1400 T980,1380" fill="none" stroke="#fef08a" stroke-width="14" opacity="0.7" />
      <path d="M120,1460 Q340,1420 560,1460 T1000,1440" fill="none" stroke="#fdba74" stroke-width="18" opacity="0.6" />
      
      <!-- Track Bed in Desert Heat -->
      <polygon points="40,1920 1040,1920 620,1300 460,1300" fill="#78350f" opacity="0.9" />
      <line x1="480" y1="1300" x2="200" y2="1920" stroke="#fcd34d" stroke-width="26" />
      <line x1="600" y1="1300" x2="880" y2="1920" stroke="#fcd34d" stroke-width="26" />

      <!-- Thematic Badge -->
      <rect x="140" y="240" width="800" height="110" rx="28" fill="rgba(69, 10, 10, 0.9)" stroke="#ef4444" stroke-width="3" />
      <text x="540" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="#fef08a">GELOMBANG PANAS EKSTREM</text>
    
</svg>